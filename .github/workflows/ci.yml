name: GitOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  kustomize:
    name: Validar Kustomize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.0"

      - name: Renderizar base
        run: |
          kubectl kustomize apps/demo/base > /tmp/base.yaml
          test -s /tmp/base.yaml

      - name: Renderizar overlay dev
        run: |
          kubectl kustomize apps/demo/overlays/dev > /tmp/dev.yaml
          test -s /tmp/dev.yaml

      - name: Exibir manifests renderizados
        run: |
          echo "Base:"
          cat /tmp/base.yaml

          echo "Overlay DEV:"
          cat /tmp/dev.yaml

  helm:
    name: Validar Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      - name: Helm lint
        run: helm lint helm/demo

      - name: Renderizar Helm Chart
        run: |
          helm template demo helm/demo > /tmp/helm.yaml
          test -s /tmp/helm.yaml

      - name: Exibir manifests Helm
        run: cat /tmp/helm.yaml

  argocd:
    name: Validar ArgoCD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validar YAML do AppProject
        run: |
          python - <<'PY'
          import yaml

          path = "argocd/projects/dev-project.yaml"

          with open(path, encoding="utf-8") as file:
              manifest = yaml.safe_load(file)

          assert manifest["apiVersion"] == "argoproj.io/v1alpha1"
          assert manifest["kind"] == "AppProject"
          assert manifest["metadata"]["name"] == "dev-project"
          assert manifest["metadata"]["namespace"] == "argocd"
          assert "spec" in manifest
          assert manifest["spec"]["sourceRepos"]
          assert manifest["spec"]["destinations"]

          print("AppProject válido.")
          PY

      - name: Validar YAML da Application
        run: |
          python - <<'PY'
          import yaml

          path = "argocd/applications/demo-app.yaml"

          with open(path, encoding="utf-8") as file:
              manifest = yaml.safe_load(file)

          assert manifest["apiVersion"] == "argoproj.io/v1alpha1"
          assert manifest["kind"] == "Application"
          assert manifest["metadata"]["name"] == "demo-app"
          assert manifest["metadata"]["namespace"] == "argocd"

          spec = manifest["spec"]

          assert spec["project"] == "dev-project"
          assert spec["source"]["repoURL"]
          assert spec["source"]["targetRevision"] == "main"
          assert spec["source"]["path"] == "apps/demo/overlays/dev"
          assert spec["destination"]["namespace"] == "dev"

          automated = spec["syncPolicy"]["automated"]

          assert automated["prune"] is True
          assert automated["selfHeal"] is True

          print("Application ArgoCD válida.")
          PY