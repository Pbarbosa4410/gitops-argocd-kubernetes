replicaCount: 2

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "250m"
    memory: "256Mi"

readinessProbe:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /
  initialDelaySeconds: 10
  periodSeconds: 20

labels:
  app: demo-app
  partOf: gitops-argocd-kubernetes
  managedBy: helm