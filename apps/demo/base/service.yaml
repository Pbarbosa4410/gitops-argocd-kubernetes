apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels:
    app: demo-app
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: gitops-argocd-kubernetes
spec:
  type: ClusterIP

  selector:
    app: demo-app

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http